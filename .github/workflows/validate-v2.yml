name: Validate XboxControllerHotkey V2 source

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/validate-v2.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile application source
        run: python -m py_compile v2/app.py
      - name: Verify bundled icon assets
        run: |
          python -c "import base64,pathlib; files=['v2/assets/configure-shortcut.png.b64','v2/assets/capture-settings.png.b64']; [(_ for _ in ()).throw(RuntimeError(f'Invalid PNG asset: {p}')) if not base64.b64decode(pathlib.Path(p).read_text().strip()).startswith(b'\\x89PNG\\r\\n\\x1a\\n') else None for p in files]"
          python -c "from pathlib import Path; assert Path('v2/assets/xbox-icon.png').is_file()"

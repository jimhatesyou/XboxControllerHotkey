name: Import V2 source and build portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "v2.0.12"
        type: string

permissions:
  contents: write

jobs:
  import-build-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract V2 source into v2/
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "xbox-hotkey-v2-source"
          Expand-Archive -LiteralPath "XboxControllerHotkey-v2.0.12-Source.zip" -DestinationPath $temp -Force
          New-Item -ItemType Directory -Path "v2" -Force | Out-Null
          Get-ChildItem -LiteralPath $temp -Force |
            Where-Object { $_.Name -notin @("__pycache__", ".github") } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination "v2" -Recurse -Force }

      - name: Commit imported source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/
          if (-not (git diff --cached --quiet)) {
            git commit -m "Import XboxControllerHotkey V2.0.12 source"
            git push origin HEAD:main
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable executable
        working-directory: v2
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name XboxControllerHotkey --icon "assets\\app-icon.ico" --collect-all pygame --collect-all winsdk --add-data "assets;assets" app.py

      - name: Create SHA256 checksum
        shell: pwsh
        working-directory: v2
        run: |
          $hash = (Get-FileHash "dist/XboxControllerHotkey.exe" -Algorithm SHA256).Hash
          "$hash  XboxControllerHotkey.exe" | Out-File -Encoding ascii "dist/XboxControllerHotkey.exe.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: main
          name: XboxControllerHotkey ${{ inputs.release_tag }}
          body_path: v2/RELEASE_NOTES_V2.0.12.md
          files: |
            v2/dist/XboxControllerHotkey.exe
            v2/dist/XboxControllerHotkey.exe.sha256
          generate_release_notes: false
          fail_on_unmatched_files: true

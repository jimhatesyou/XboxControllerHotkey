name: Build and publish XboxControllerHotkey

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "v2.0.14"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable executable
        working-directory: v2
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name XboxControllerHotkey --icon "assets\\app-icon.ico" --collect-all pygame --collect-all winsdk --add-data "assets;assets" app.py

      - name: Create SHA256 checksum
        shell: pwsh
        working-directory: v2
        run: |
          $hash = (Get-FileHash "dist/XboxControllerHotkey.exe" -Algorithm SHA256).Hash
          "$hash  XboxControllerHotkey.exe" | Out-File -Encoding ascii "dist/XboxControllerHotkey.exe.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: main
          name: XboxControllerHotkey ${{ inputs.release_tag }}
          body_path: v2/RELEASE_NOTES_V2.0.14.md
          files: |
            v2/dist/XboxControllerHotkey.exe
            v2/dist/XboxControllerHotkey.exe.sha256
          generate_release_notes: false
          fail_on_unmatched_files: true

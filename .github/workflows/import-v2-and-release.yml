name: Build and publish XboxControllerHotkey

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (manual runs only)"
        required: true
        default: "v2.0.24"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Set automatic release version
        id: version
        shell: pwsh
        run: |
          $app = "v2/app.py"
          $source = Get-Content -LiteralPath $app -Raw
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
            $version = $tag.TrimStart('v','V')
          } else {
            # The app's checked-in version is the single source of truth.
            $match = [regex]::Match($source, '(?m)^APP_VERSION = "([^"]+)"')
            if (-not $match.Success) { throw "Could not read APP_VERSION from v2/app.py" }
            $version = $match.Groups[1].Value
            $tag = "v$version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Building release $tag from ${{ github.sha }}"

      - name: Install dependencies
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable executable
        working-directory: v2
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name XboxControllerHotkey --icon "assets\\app-icon.ico" --collect-all pygame --collect-all winsdk --add-data "assets;assets" app.py

      - name: Create SHA256 checksum
        shell: pwsh
        working-directory: v2
        run: |
          $hash = (Get-FileHash "dist/XboxControllerHotkey.exe" -Algorithm SHA256).Hash
          "$hash  XboxControllerHotkey.exe" | Out-File -Encoding ascii "dist/XboxControllerHotkey.exe.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: XboxControllerHotkey v${{ steps.version.outputs.version }}
          files: |
            v2/dist/XboxControllerHotkey.exe
            v2/dist/XboxControllerHotkey.exe.sha256
          body_path: v2/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true

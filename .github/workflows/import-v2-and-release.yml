name: Build and publish XboxControllerHotkey

on:
  push:
    branches:
      - main
    paths:
      - "v2/**"
      - ".github/workflows/import-v2-and-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (manual release)"
        required: true
        default: "v2.0.22"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Determine version and release behavior
        id: meta
        shell: pwsh
        run: |
          $app = Get-Content "v2/app.py" -Raw
          if ($app -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "Could not read APP_VERSION from v2/app.py"
          }
          $version = $Matches[1]
          $notes = "v2/RELEASE_NOTES_V$version.md"
          $versionChanged = $false
          if (" ${{ github.event_name }} " -eq " push ") {
            $previous = git show "HEAD^:v2/app.py" 2>$null
            if ($LASTEXITCODE -eq 0 -and $previous -match 'APP_VERSION\s*=\s*"([^"]+)"') {
              $versionChanged = ($Matches[1] -ne $version)
            }
            if (-not (Test-Path $notes)) {
              Write-Host "No matching release notes file at $notes; this push will produce a build artifact only."
              $versionChanged = $false
            }
            $tag = "v$version"
          } else {
            $tag = "${{ inputs.release_tag }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "publish_release=$versionChanged" >> $env:GITHUB_OUTPUT
          "notes_file=$notes" >> $env:GITHUB_OUTPUT
          Write-Host "Application version: $version"
          Write-Host "Release tag: $tag"
          Write-Host "Automatic release enabled: $versionChanged"

      - name: Install dependencies
        working-directory: v2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable executable
        working-directory: v2
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name XboxControllerHotkey --icon "assets\\app-icon.ico" --collect-all pygame --collect-all winsdk --add-data "assets;assets" app.py

      - name: Create SHA256 checksum
        shell: pwsh
        working-directory: v2
        run: |
          $hash = (Get-FileHash "dist/XboxControllerHotkey.exe" -Algorithm SHA256).Hash
          "$hash  XboxControllerHotkey.exe" | Out-File -Encoding ascii "dist/XboxControllerHotkey.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XboxControllerHotkey-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            v2/dist/XboxControllerHotkey.exe
            v2/dist/XboxControllerHotkey.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || steps.meta.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: main
          name: XboxControllerHotkey ${{ steps.meta.outputs.release_tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          files: |
            v2/dist/XboxControllerHotkey.exe
            v2/dist/XboxControllerHotkey.exe.sha256
          generate_release_notes: false
          fail_on_unmatched_files: true
